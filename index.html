<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🪞🪞🪞</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; overflow: hidden;
            touch-action: none;
        }

        #camera-video {
            position: absolute; width: 1px; height: 1px;
            opacity: 0.01; pointer-events: none; z-index: -1;
        }

        #art-canvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 0;
        }

        /* 圓形快門按鈕 */
        #shutter-btn {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 4px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }

        #shutter-btn::after {
            content: '';
            width: 54px;
            height: 54px;
            background-color: #fff;
            border-radius: 50%;
            transition: transform 0.1s ease-out;
        }

        #shutter-btn:active::after {
            transform: scale(0.85);
        }
        
        #flash-overlay {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: white;
            opacity: 0; pointer-events: none; z-index: 20;
        }
    </style>
</head>
<body>

    <video id="camera-video" autoplay playsinline webkit-playsinline muted></video>
    <canvas id="art-canvas"></canvas>
    <div id="shutter-btn"></div>
    <div id="flash-overlay"></div>

    <script>
        const video = document.getElementById('camera-video');
        const displayCanvas = document.getElementById('art-canvas');
        const displayCtx = displayCanvas.getContext('2d', { willReadFrequently: true });
        const shutterBtn = document.getElementById('shutter-btn');
        const flashOverlay = document.getElementById('flash-overlay');

        const pixelCanvas = document.createElement('canvas');
        const pixelCtx = pixelCanvas.getContext('2d', { willReadFrequently: true });

        // ==========================================
        // 藝術家參數設定 (解析度)
        // ==========================================
        const RESOLUTION = 60; // 橫向色塊的數量，越小色塊越大

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    requestAnimationFrame(renderLoop);
                };
            } catch (err) {
                alert("相機啟動失敗，請確保使用 HTTPS 並授權相機權限。");
            }
        }

        function renderLoop() {
            if (video.videoWidth === 0) {
                requestAnimationFrame(renderLoop);
                return;
            }

            const w = window.innerWidth;
            const h = window.innerHeight;
            if (displayCanvas.width !== w) {
                displayCanvas.width = w;
                displayCanvas.height = h;
            }

            // 計算色塊大小
            const blockSize = w / RESOLUTION;
            const cols = RESOLUTION;
            const rows = Math.ceil(h / blockSize);

            pixelCanvas.width = cols;
            pixelCanvas.height = rows;

            // 將相機畫面縮小到像素畫布
            pixelCtx.drawImage(video, 0, 0, cols, rows);
            const pixels = pixelCtx.getImageData(0, 0, cols, rows).data;

            // 清空背景
            displayCtx.fillStyle = '#000';
            displayCtx.fillRect(0, 0, w, h);

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const offset = (y * cols + x) * 4;
                    const r = pixels[offset];
                    const g = pixels[offset + 1];
                    const b = pixels[offset + 2];

                    // 計算亮度 (0~255)
                    const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b);
                    
                    // 【核心邏輯】將亮度映射到 0%, 10%, ... 100% 的灰階
                    // 我們將亮度除以 255 得到 0~1，乘上 10 再四捨五入，得到 0~10 的級別
                    const level = Math.round((luminance / 255) * 10);
                    // 再將這個級別轉回 0~255 的灰階數值
                    const grayValue = Math.floor(level * 25.5);

                    // 設定畫布顏色為該級別的灰色
                    displayCtx.fillStyle = `rgb(${grayValue}, ${grayValue}, ${grayValue})`;
                    
                    // 在對應位置畫出正方形色塊
                    // 使用 Math.ceil(blockSize) 是為了確保色塊之間沒有細微縫隙
                    displayCtx.fillRect(x * blockSize, y * blockSize, Math.ceil(blockSize), Math.ceil(blockSize));
                }
            }

            requestAnimationFrame(renderLoop);
        }

        // 快門拍照
        shutterBtn.addEventListener('click', () => {
            // 閃光效果
            flashOverlay.style.opacity = '1';
            flashOverlay.style.transition = 'none';
            setTimeout(() => {
                flashOverlay.style.transition = 'opacity 0.4s ease-out';
                flashOverlay.style.opacity = '0';
            }, 40);

            // 儲存 PNG
            const dataURL = displayCanvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `Grayscale-Art-${Date.now()}.png`;
            link.href = dataURL;
            link.click();
        });

        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
